<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Data model and stores</title><desc id="d">Four groups of stored data: registry, per-request records, evidence for prediction, and secrets outside the tables.</desc><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20.0" y="20.0" width="440.0" height="210.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="13" font-weight="bold" fill="#111827"><tspan x="240.0" y="44.5">1. Registry (set up by the administrator)</tspan></text><text text-anchor="start" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="34" y="64.5">Model: model_id, revision, context_limit, tokenizer_ref</tspan><tspan x="34" y="79.5">Capability / ModelCapability: named capabilities per model</tspan><tspan x="34" y="94.5">Deployment: model_id, authorised_endpoint_ref, engine</tspan><tspan x="34" y="109.5">PriceVersion: rates, currency, cost_basis (immutable)</tspan><tspan x="34" y="124.5">PolicyVersion: quality_floor, cost_cap, deadline_rule</tspan><tspan x="34" y="139.5">(Attempt and Estimate point back to these by key)</tspan></text><rect x="520.0" y="20.0" width="440.0" height="210.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="13" font-weight="bold" fill="#111827"><tspan x="740.0" y="44.5">2. Per-request records</tspan></text><text text-anchor="start" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="534" y="64.5">Request: policy_id, token_estimate, final_status</tspan><tspan x="534" y="79.5">Estimate: one frozen prediction per (request, model)</tspan><tspan x="534" y="94.5">Attempt: deployment, price version, ordinal, outcome,</tspan><tspan x="534" y="109.5">   usage_state, known_cost</tspan><tspan x="534" y="124.5">Reservation: reserved_amount, reconciliation_state</tspan><tspan x="534" y="139.5">HealthEvent: signal, breaker_transition</tspan></text><rect x="20.0" y="290.0" width="440.0" height="190.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="13" font-weight="bold" fill="#111827"><tspan x="240.0" y="314.6">3. Evidence for prediction</tspan></text><text text-anchor="start" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="34" y="334.5">ExperimentRun: dataset revision, split manifest, seed</tspan><tspan x="34" y="349.5">EvaluationRecord: (run, task_key, model) -&gt; score,</tspan><tspan x="34" y="364.5">   token counts, cost basis   &lt;- model x request outcome table</tspan><tspan x="34" y="379.5">Embedding index: one vector per indexed REQUEST</tspan><tspan x="34" y="394.5">   (storage location is an open decision)</tspan></text><rect x="520.0" y="290.0" width="440.0" height="190.0" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text text-anchor="middle" font-size="13" font-weight="bold" fill="#111827"><tspan x="740.0" y="314.6">4. Outside the tables</tspan></text><text text-anchor="start" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="534" y="334.5">Protected secret store: API keys and credentials</tspan><tspan x="534" y="349.5">   (Deployment keeps only a reference)</tspan><tspan x="534" y="364.5">Decision log: redacted estimates, exclusions, timings</tspan><tspan x="534" y="379.5"></tspan><tspan x="534" y="394.5">Raw prompt text is not required in operational tables.</tspan></text><path d="M460.0,125.0 L518.0,125.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="425.6" y="85.5" width="126.8" height="29.0" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="10" font-weight="normal" fill="#374151"><tspan x="489" y="97.1">Attempt -&gt; Deployment,</tspan><tspan x="489" y="109.9">PriceVersion</tspan></text><path d="M240.0,230.0 L240.0,288.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="243.3" y="250.4" width="53.4" height="17.1" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="10.5" font-weight="normal" fill="#374151"><tspan x="270" y="262.7">model_id</tspan></text><path d="M740.0,230.0 L740.0,288.0" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a0)"/><rect x="668.0" y="250.4" width="144.1" height="17.1" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="10.5" font-weight="normal" fill="#374151"><tspan x="740" y="262.7">Deployment -&gt; secret ref</tspan></text></svg>