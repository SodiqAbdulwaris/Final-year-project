<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Circuit breaker states</title><desc id="d">Closed, open and half-open states with the transitions between them and the effect of each state on eligibility.</desc><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="55.0" y="105.0" width="190.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="150" y="136.4">CLOSED</tspan><tspan x="150" y="152.4">normal; failures counted</tspan></text><rect x="605.0" y="105.0" width="190.0" height="70.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="700" y="136.4">OPEN</tspan><tspan x="700" y="152.4">excluded from E(q)</tspan></text><rect x="320.0" y="285.0" width="210.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="425" y="316.4">HALF-OPEN</tspan><tspan x="425" y="332.4">bounded probe calls only</tspan></text><path d="M245.0,140.0 L605.0,140.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="324.7" y="123.6" width="200.5" height="32.8" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#374151"><tspan x="425.0" y="136.7">failures reach the threshold</tspan><tspan x="425.0" y="151.4">(illustrative: 3 in the window)</tspan></text><path d="M650.0,175.0 L650.0,320.0 L530.0,320.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="623.3" y="274.9" width="53.4" height="30.2" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="10.5" font-weight="normal" fill="#374151"><tspan x="650" y="287.0">cooldown</tspan><tspan x="650" y="300.4">elapsed</tspan></text><path d="M320.0,320.0 L150.0,320.0 L150.0,175.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="187.5" y="310.8" width="94.9" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#374151"><tspan x="235.0" y="324.0">probe succeeds</tspan></text><path d="M470.0,285.0 L470.0,215.0 L760.0,215.0 L760.0,175.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><rect x="523.3" y="206.1" width="73.3" height="17.8" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11" font-weight="normal" fill="#dc2626"><tspan x="560" y="218.8">probe fails</tspan></text><path d="M110.0,105.0 L110.0,70.0 L190.0,70.0 L190.0,105.0" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a4)"/><rect x="46.8" y="46.4" width="206.5" height="17.1" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="10.5" font-weight="normal" fill="#6b7280"><tspan x="150" y="58.7">success, or failure below threshold</tspan></text><text text-anchor="middle" font-size="11" font-weight="normal" fill="#4b5563" font-style="italic"><tspan x="430" y="403.9">Transition rules are the standard pattern (extension). Thresholds, window, cooldown and probe count are open decisions.</tspan></text></svg>