<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Illustrative seven-model pool</title><desc id="d">Seven invented deployments grouped by where they run, coloured by quality evidence and health.</desc><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#dc2626"><tspan x="500" y="26.4">ILLUSTRATIVE: all names, prices and states are invented</tspan></text><rect x="15.0" y="40.0" width="250.0" height="400.0" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4b5563"><tspan x="140.0" y="64.4">Abroad: hosted APIs</tspan></text><rect x="280.0" y="40.0" width="260.0" height="400.0" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4b5563"><tspan x="410.0" y="64.4">On premises: Ollama (team laptops)</tspan></text><rect x="555.0" y="40.0" width="430.0" height="400.0" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4b5563"><tspan x="770.0" y="64.4">On premises / in-country</tspan></text><rect x="40.0" y="74.0" width="200.0" height="112.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="140" y="111.9">Host-Lite</tspan><tspan x="140" y="126.7">ctx 128k · $0.15 / $0.60</tspan><tspan x="140" y="141.4">evidence: sufficient</tspan><tspan x="140" y="156.1">health: 2 recent failures</tspan></text><rect x="40.0" y="204.0" width="200.0" height="112.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="140" y="241.9">Host-Mid</tspan><tspan x="140" y="256.7">ctx 128k · $1.00 / $4.00</tspan><tspan x="140" y="271.4">evidence: sufficient</tspan><tspan x="140" y="286.1">health: closed (ok)</tspan></text><rect x="40.0" y="334.0" width="200.0" height="112.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="140" y="371.9">Host-Pro</tspan><tspan x="140" y="386.7">ctx 200k · $5.00 / $20.00</tspan><tspan x="140" y="401.4">evidence: sufficient</tspan><tspan x="140" y="416.1">health: closed (ok)</tspan></text><rect x="310.0" y="74.0" width="200.0" height="112.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="410" y="111.9">Local-S</tspan><tspan x="410" y="126.7">ctx 8k · basis $0.02</tspan><tspan x="410" y="141.4">evidence: sufficient</tspan><tspan x="410" y="156.1">health: closed (ok)</tspan></text><rect x="310.0" y="204.0" width="200.0" height="112.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="410" y="241.9">Local-M</tspan><tspan x="410" y="256.7">ctx 8k · basis $0.05</tspan><tspan x="410" y="271.4">evidence: sufficient</tspan><tspan x="410" y="286.1">health: breaker OPEN</tspan></text><rect x="310.0" y="334.0" width="200.0" height="112.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="410" y="371.9">Local-Code</tspan><tspan x="410" y="386.7">ctx 16k · basis $0.05</tspan><tspan x="410" y="401.4">evidence: partial (code, maths)</tspan><tspan x="410" y="416.1">health: closed (ok)</tspan></text><rect x="600.0" y="74.0" width="200.0" height="112.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="700" y="111.9">Custom-OA</tspan><tspan x="700" y="126.7">ctx 32k · basis $0.08</tspan><tspan x="700" y="141.4">evidence: none (pending)</tspan><tspan x="700" y="156.1">health: closed (ok)</tspan></text><text text-anchor="middle" font-size="12" font-weight="normal" fill="#4b5563"><tspan x="790" y="296.5">OpenAI-compatible server</tspan><tspan x="790" y="311.9">in-country (university)</tspan></text><rect x="560.0" y="352.0" width="22.0" height="16.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="start" font-size="12" font-weight="normal" fill="#111827"><tspan x="590" y="364.2">sufficient evidence, healthy</tspan></text><rect x="560.0" y="376.0" width="22.0" height="16.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="start" font-size="12" font-weight="normal" fill="#111827"><tspan x="590" y="388.2">partial evidence or recent failures</tspan></text><rect x="560.0" y="400.0" width="22.0" height="16.0" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="start" font-size="12" font-weight="normal" fill="#111827"><tspan x="590" y="412.2">circuit breaker open</tspan></text><rect x="560.0" y="424.0" width="22.0" height="16.0" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text text-anchor="start" font-size="12" font-weight="normal" fill="#111827"><tspan x="590" y="436.2">no quality evidence yet</tspan></text><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#4b5563" font-style="italic"><tspan x="500" y="496.7">Prices are USD per million tokens (input / output); "basis" is the explicit local cost basis.</tspan><tspan x="500" y="511.4">Tools and JSON-mode support are listed in the registry table.</tspan></text></svg>