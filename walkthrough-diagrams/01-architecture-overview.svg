<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Architecture overview</title><desc id="d">Client request path through the modules of one application, with stores on the right and model backends below.</desc><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="5.0" y="15.0" width="190.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="100" y="36.5">Client application</tspan><tspan x="100" y="51.9">(OpenAI-style request + policy)</tspan></text><rect x="760.0" y="15.0" width="200.0" height="50.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="860" y="36.5">Administrator</tspan><tspan x="860" y="51.9">(registry, prices, policies)</tspan></text><rect x="30.0" y="95.0" width="700.0" height="280.0" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="bold" fill="#4b5563"><tspan x="380" y="116.2">ONE MODULAR APPLICATION (Python / FastAPI)</tspan></text><rect x="40.0" y="145.0" width="120.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="100" y="171.5">Validate +</tspan><tspan x="100" y="186.9">authenticate</tspan></text><rect x="180.0" y="145.0" width="120.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="240" y="171.5">Hard filter</tspan><tspan x="240" y="186.9">(can it?)</tspan></text><rect x="320.0" y="145.0" width="120.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="380" y="171.5">Task analyser</tspan><tspan x="380" y="186.9">(what kind?)</tspan></text><rect x="460.0" y="145.0" width="120.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="520" y="163.8">Retriever</tspan><tspan x="520" y="179.2">(similar past</tspan><tspan x="520" y="194.6">requests)</tspan></text><rect x="600.0" y="145.0" width="120.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="660" y="171.5">Predictor</tspan><tspan x="660" y="186.9">(Q̂, Ĉ, L̂)</tspan></text><rect x="600.0" y="280.0" width="120.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="660" y="298.8">Selector</tspan><tspan x="660" y="314.2">(cheapest</tspan><tspan x="660" y="329.6">feasible)</tspan></text><rect x="460.0" y="280.0" width="120.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="520" y="298.8">Budget accountant</tspan><tspan x="520" y="314.2">(reserve,</tspan><tspan x="520" y="329.6">reconcile)</tspan></text><rect x="320.0" y="280.0" width="120.0" height="60.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="380" y="306.5">Execution controller</tspan><tspan x="380" y="321.9">+ adapters</tspan></text><rect x="180.0" y="280.0" width="120.0" height="60.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="240" y="306.5">Health tracker +</tspan><tspan x="240" y="321.9">circuit breakers</tspan></text><rect x="40.0" y="280.0" width="120.0" height="60.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="100" y="306.5">Decision log</tspan><tspan x="100" y="321.9">(redacted)</tspan></text><path d="M160.0,175.0 L180.0,175.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M300.0,175.0 L320.0,175.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M440.0,175.0 L460.0,175.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M580.0,175.0 L600.0,175.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M660.0,205.0 L660.0,280.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M600.0,310.0 L580.0,310.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M460.0,310.0 L440.0,310.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M320.0,310.0 L300.0,310.0" fill="none" stroke="#374151" stroke-width="1.6" marker-