<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Monitoring and offline calibration loop</title><desc id="d">Router writes redacted decision records; a monitoring view shows aggregates; an offline calibration job uses permitted validation evidence and produces a new reviewed predictor revision. No automatic online update.</desc><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="35.0" y="50.0" width="210.0" height="60.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111827"><tspan x="140" y="76.4">Router handling</tspan><tspan x="140" y="92.4">live requests</tspan></text><rect x="325.0" y="50.0" width="230.0" height="60.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="440" y="68.8">Decision log (redacted):</tspan><tspan x="440" y="84.2">estimates, exclusions, timing,</tspan><tspan x="440" y="99.6">health, spend</tspan></text><rect x="640.0" y="50.0" width="240.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="760" y="68.8">Monitoring view / export:</tspan><tspan x="760" y="84.2">quality, cost, latency, health,</tspan><tspan x="760" y="99.6">constraint outcomes (FR-17)</tspan></text><path d="M245.0,80.0 L325.0,80.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M555.0,80.0 L640.0,80.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="25.0" y="230.0" width="230.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="140" y="256.5">Permitted validation evidence</tspan><tspan x="140" y="271.9">(scored requests)</tspan></text><rect x="325.0" y="230.0" width="230.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="440" y="256.5">Offline calibration job:</tspan><tspan x="440" y="271.9">Brier score + reliability table</tspan></text><rect x="635.0" y="230.0" width="250.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="760" y="256.5">New predictor / calibration</tspan><tspan x="760" y="271.9">revision (versioned)</tspan></text><path d="M255.0,260.0 L325.0,260.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M555.0,260.0 L635.0,260.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M440.0,110.0 L440.0,230.0" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a4)"/><rect x="373.9" y="153.6" width="132.2" height="32.8" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#6b7280"><tspan x="440.0" y="166.7">drift and violations</tspan><tspan x="440.0" y="181.4">to examine</tspan></text><rect x="635.0" y="375.0" width="250.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="760" y="404.2">Review, then deploy as a new version</tspan></text><path d="M760.0,290.0 L760.0,375.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M635.0,400.0 L140.0,400.0 L140.0,112.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2)"/><rect x="299.9" y="384.2" width="180.3" height="31.5" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11" font-weight="normal" fill="#16a34a"><tspan x="390" y="396.8">redeploy: Router uses the new</tspan><tspan x="390" y="410.9">version for later requests</tspan></text><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#4b5563" font-style="italic"><tspan x="480" y="484.0">Logging alone is not online adaptation (draft 3.6.5). No live learning mechanism is approved. Dashed = extension detail.</tspan></text></svg>