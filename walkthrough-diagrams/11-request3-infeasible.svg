<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 655" width="1000" height="655" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Request 3 funnel</title><desc id="d">Seven models narrowed to none: privacy removes three, capability removes two, health removes one, and the last has no evidence, so the request is infeasible.</desc><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626"><tspan x="500.0" y="24.2">ILLUSTRATIVE numbers</tspan></text><rect x="130.0" y="34.0" width="380.0" height="52.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="320" y="64.4">Registered: 7 deployments</tspan></text><rect x="150.0" y="139.0" width="340.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="320" y="169.4">After privacy rule: 4</tspan></text><rect x="170.0" y="244.0" width="300.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="320" y="274.4">After capability rule (JSON mode): 2</tspan></text><rect x="195.0" y="349.0" width="250.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="320" y="379.4">After health rule, E(q): 1</tspan></text><rect x="220.0" y="454.0" width="200.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="320" y="484.4">Feasible set F(q): 0</tspan></text><path d="M320.0,86.0 L320.0,139.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M320.0,191.0 L320.0,244.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M320.0,296.0 L320.0,349.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M320.0,401.0 L320.0,454.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="560.0" y="79.0" width="400.0" height="66.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="760" y="108.7">Privacy "in-country only" removes 3:</tspan><tspan x="760" y="123.4">Host-Lite, Host-Mid, Host-Pro (abroad)</tspan></text><path d="M320.0,112.0 L558.0,112.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a1)"/><rect x="560.0" y="184.0" width="400.0" height="66.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="760" y="213.7">Needs JSON mode, removes 2:</tspan><tspan x="760" y="228.4">Local-S, Local-Code (no JSON mode)</tspan></text><path d="M320.0,217.0 L558.0,217.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a1)"/><rect x="560.0" y="289.0" width="400.0" height="66.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="760" y="326.0">Local-M removed: breaker OPEN</tspan></text><path d="M320.0,322.0 L558.0,322.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a1)"/><rect x="560.0" y="394.0" width="400.0" height="66.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#111827"><tspan x="760" y="423.7">Custom-OA has no evidence, so no</tspan><tspan x="760" y="438.4">estimate can clear the floor 0.85</tspan></text><path d="M320.0,427.0 L558.0,427.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a1)"/><rect x="110.0" y="543.0" width="420.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="320" y="569.4">INFEASIBLE returned; no model called; nothing spent</tspan></text><path d="M320.0,506.0 L320.0,543.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/></svg>