<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Evaluator pipeline</title><desc id="d">Evaluation pipeline: inspect benchmark data, clean, grouped split, fit on train and validation, run arms on replay, pilot and fault injection, paired analysis.</desc><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20.0" y="22.0" width="200.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="120" y="46.5">Scored benchmark data</tspan><tspan x="120" y="61.9">(RouterBench, LLMRouterBench)</tspan></text><rect x="265.0" y="22.0" width="210.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="370" y="46.5">Check licence, coverage,</tspan><tspan x="370" y="61.9">aligned outcomes</tspan></text><rect x="515.0" y="22.0" width="210.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="620" y="46.5">Clean: duplicates, invalid</tspan><tspan x="620" y="61.9">scores, token/cost units</tspan></text><rect x="775.0" y="22.0" width="190.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="870" y="46.5">Grouped split</tspan><tspan x="870" y="61.9">(duplicates together)</tspan></text><path d="M220.0,50.0 L265.0,50.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M475.0,50.0 L515.0,50.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M725.0,50.0 L775.0,50.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="175.0" y="138.0" width="150.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="250" y="164.4">Training</tspan></text><rect x="425.0" y="138.0" width="150.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="500" y="164.4">Validation</tspan></text><rect x="700.0" y="138.0" width="200.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827"><tspan x="800" y="164.4">Test (untouched)</tspan></text><path d="M870.0,78.0 L870.0,105.0 L250.0,105.0 L250.0,138.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M870.0,78.0 L870.0,105.0 L500.0,105.0 L500.0,138.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M870.0,78.0 L870.0,108.0 L800.0,108.0 L800.0,138.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="185.0" y="232.0" width="380.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="375" y="256.5">Fit on training + validation only:</tspan><tspan x="375" y="271.9">classifier, index, normalisers, calibration, k, margins</tspan></text><path d="M250.0,182.0 L250.0,207.0 L375.0,207.0 L375.0,232.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M500.0,182.0 L500.0,207.0 L375.0,207.0 L375.0,232.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="220.0" y="332.0" width="760.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="600" y="356.5">Run the arms on the SAME test requests: fixed model, cheapest eligible, rule-based,</tspan><tspan x="600" y="371.9">lightweight learned, hybrid, ablations, utility variant (optional cascade)</tspan></text><path d="M375.0,288.0 L375.0,310.0 L600.0,310.0 L600.0,332.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M800.0,182.0 L800.0,257.0 L600.0,257.0 L600.0,332.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="705.3" y="259.4" width="189.4" height="17.1" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="10.5" font-weight="normal" fill="#374151"><tspan x="800" y="271.7">labels revealed only for scoring</tspan></text><rect x="50.0" y="442.0" width="300.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="200" y="466.5">Replay: stored outcomes</tspan><tspan x="200" y="481.9">(quality, cost; not live latency)</tspan></text><rect x="385.0" y="442.0" width="270.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="520" y="466.5">Capped live pilot</tspan><tspan x="520" y="481.9">(latency, overhead, spend recorded)</tspan></text><rect x="685.0" y="442.0" width="290.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="830" y="458.8">Local failure injection</tspan><tspan x="830" y="474.2">(timeouts, throttling, server errors,</tspan><tspan x="830" y="489.6">malformed replies, cut streams)</tspan></text><path d="M600.0,388.0 L600.0,415.0 L200.0,415.0 L200.0,442.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M600.0,388.0 L600.0,415.0 L520.0,415.0 L520.0,442.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M600.0,388.0 L600.0,415.0 L830.0,415.0 L830.0,442.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="120.0" y="553.0" width="760.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="500" y="579.2">Paired analysis: bootstrap (grouped), McNemar, Wilcoxon, Holm; every result with interval and n</tspan></text><path d="M200.0,498.0 L200.0,525.5 L500.0,525.5 L500.0,553.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M520.0,498.0 L520.0,525.5 L500.0,525.5 L500.0,553.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M830.0,498.0 L830.0,525.5 L500.0,525.5 L500.0,553.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/></svg>