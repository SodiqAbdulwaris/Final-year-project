<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1010" width="940" height="1010" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Administrator onboarding flow</title><desc id="d">Flow for adding a model deployment: choose type, store key, authorise endpoint, record capabilities and price, test, enable or flag for benchmarking.</desc><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="350.0" y="15.0" width="240.0" height="40.0" rx="20.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text text-anchor="middle" font-size="13" font-weight="normal" fill="#111827"><tspan x="470" y="39.5">Administrator signs in</tspan></text><polygon points="470,80.0 580.0,115 470,150.0 360.0,115" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111827"><tspan x="470" y="119.4">Which kind of deployment?</tspan></text><rect x="55.0" y="177.0" width="210.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="160" y="201.5">Hosted API</tspan><tspan x="160" y="216.9">base URL + API key</tspan></text><rect x="365.0" y="177.0" width="210.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="470" y="201.5">Ollama host</tspan><tspan x="470" y="216.9">base URL (explicitly local)</tspan></text><rect x="675.0" y="177.0" width="210.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="780" y="201.5">OpenAI-compatible endpoint</tspan><tspan x="780" y="216.9">base URL + key if needed</tspan></text><rect x="305.0" y="273.0" width="330.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="470" y="299.2">Enter model id + pinned revision (quantisation for local)</tspan></text><rect x="305.0" y="343.0" width="330.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="470" y="361.5">Put the key in the protected secret store;</tspan><tspan x="470" y="376.9">Deployment row keeps a reference only</tspan></text><rect x="280.0" y="412.0" width="380.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="470" y="436.5">Authorise the endpoint: SSRF checks on scheme,</tspan><tspan x="470" y="451.9">destination, redirects; local only if explicitly authorised</tspan></text><polygon points="470,492.0 555.0,520 470,548.0 385.0,520" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111827"><tspan x="470" y="524.4">Allowed?</tspan></text><rect x="690.0" y="498.0" width="200.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="790" y="524.2">Reject, tell the administrator</tspan></text><rect x="300.0" y="583.0" width="340.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="470" y="601.5">Capabilities + context window</tspan><tspan x="470" y="616.9">(local: use the window actually configured)</tspan></text><rect x="280.0" y="655.0" width="380.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="470" y="676.5">Price version + cost basis</tspan><tspan x="470" y="691.9">(local cost basis explicit, never silently zero)</tspan></text><rect x="320.0" y="733.0" width="300.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="470" y="759.2">Test call (confirms key, reply and usage fields)</tspan></text><polygon points="470,807.0 555.0,835 470,863.0 385.0,835" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111827"><tspan x="470" y="839.4">Test OK?</tspan></text><rect x="690.0" y="813.0" width="200.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="790" y="839.2">Fix settings and retry</tspan></text><polygon points="470,890.0 585.0,920 470,950.0 355.0,920" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="470" y="924.2">Quality evidence for this model?</tspan></text><rect x="35.0" y="958.0" width="270.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="170" y="984.2">Enable for learned routing</tspan></text><rect x="610.0" y="953.0" width="300.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="760" y="971.5">Enable as flagged: no evidence -&gt;</tspan><tspan x="760" y="986.9">run onboarding benchmark (Fig 13)</tspan></text><path d="M470.0,55.0 L470.0,80.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M360.0,115.0 L160.0,115.0 L160.0,177.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M470.0,150.0 L470.0,177.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M580.0,115.0 L780.0,115.0 L780.0,177.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M160.0,233.0 L160.0,253.0 L470.0,253.0 L470.0,273.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M470.0,233.0 L470.0,273.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M780.0,233.0 L780.0,253.0 L470.0,253.0 L470.0,273.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M470.0,317.0 L470.0,343.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M470.0,387.0 L470.0,412.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M470.0,468.0 L470.0,492.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M555.0,520.0 L690.0,520.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><rect x="612.3" y="510.8" width="20.4" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#dc2626"><tspan x="622.5" y="524.0">no</tspan></text><path d="M470.0,548.0 L470.0,583.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2)"/><rect x="456.7" y="556.3" width="26.6" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#16a34a"><tspan x="470.0" y="569.5">yes</tspan></text><path d="M470.0,627.0 L470.0,655.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M470.0,705.0 L470.0,733.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M470.0,777.0 L470.0,807.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M555.0,835.0 L690.0,835.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><rect x="612.3" y="825.8" width="20.4" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#dc2626"><tspan x="622.5" y="839.0">no</tspan></text><path d="M790.0,813.0 L790.0,780.0 L630.0,780.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a1)"/><path d="M470.0,863.0 L470.0,890.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2)"/><rect x="456.7" y="867.3" width="26.6" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#16a34a"><tspan x="470.0" y="880.5">yes</tspan></text><path d="M355.0,920.0 L170.0,920.0 L170.0,958.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2)"/><rect x="227.4" y="910.8" width="70.1" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#16a34a"><tspan x="262.5" y="924.0">sufficient</tspan></text><path d="M585.0,920.0 L760.0,920.0 L760.0,953.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="625.0" y="910.8" width="94.9" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#374151"><tspan x="672.5" y="924.0">none / partial</tspan></text><rect x="20.0" y="52.0" width="22.0" height="16.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="start" font-size="12" font-weight="normal" fill="#111827"><tspan x="50" y="64.2">Stated in the draft</tspan></text><rect x="20.0" y="76.0" width="22.0" height="16.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="start" font-size="12" font-weight="normal" fill="#111827"><tspan x="50" y="88.2">Extension (not in the draft)</tspan></text><text text-anchor="middle" font-size="1" font-weight="normal" fill="#111827"><tspan x="20" y="105.3"></tspan></text></svg>