<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1060" width="940" height="1060" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">New model onboarding benchmark flow</title><desc id="d">Extension flow: register as benchmarking, choose a stratified subset of indexed prompts, confirm cost, run, score, store outcomes, check calibration, enable.</desc><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text text-anchor="middle" font-size="12.5" font-weight="bold" fill="#dc2626"><tspan x="470" y="22.4">EXTENSION: not part of the draft or its evaluated pool</tspan></text><rect x="140.0" y="43.0" width="520.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="400" y="74.2">Register deployment (status: benchmarking, not routable by learned policy)</tspan></text><rect x="140.0" y="138.0" width="520.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="400" y="161.5">Pick calibration subset: stratified by task and difficulty,</tspan><tspan x="400" y="176.9">from training + validation prompts only</tspan></text><path d="M400.0,97.0 L400.0,138.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="140.0" y="233.0" width="520.0" height="54.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="400" y="264.2">Estimate cost (prompts x tokens x price, or run time) and ask the admin to confirm</tspan></text><path d="M400.0,192.0 L400.0,233.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="140.0" y="328.0" width="520.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="400" y="351.5">Run each prompt through the normal adapter, same prompt format</tspan><tspan x="400" y="366.9">and settings as the dataset; spend via the reservation system</tspan></text><path d="M400.0,287.0 L400.0,328.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="140.0" y="423.0" width="520.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="400" y="454.2">Score each answer with the dataset's own scoring procedure</tspan></text><path d="M400.0,382.0 L400.0,423.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="140.0" y="518.0" width="520.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="400" y="541.5">Store new EvaluationRecord rows (new ExperimentRun) + latency stats;</tspan><tspan x="400" y="556.9">index and vectors untouched</tspan></text><path d="M400.0,477.0 L400.0,518.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="140.0" y="613.0" width="520.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="400" y="644.2">Set evidence level per task category (none / partial / sufficient)</tspan></text><path d="M400.0,572.0 L400.0,613.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="140.0" y="708.0" width="520.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="400" y="739.2">Check Brier score on a held-out slice of the subset</tspan></text><path d="M400.0,667.0 L400.0,708.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><polygon points="400,795.0 510.0,830 400,865.0 290.0,830" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="400" y="826.5">Passes and</tspan><tspan x="400" y="841.9">evidence sufficient?</tspan></text><path d="M400.0,762.0 L400.0,795.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><rect x="15.0" y="908.0" width="230.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="130" y="934.2">Enable for learned selection</tspan></text><rect x="575.0" y="802.0" width="250.0" height="56.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="700" y="818.8">Stay flagged: excluded from</tspan><tspan x="700" y="834.2">learned selection; add more</tspan><tspan x="700" y="849.6">prompts or stop</tspan></text><path d="M400.0,865.0 L400.0,886.5 L130.0,886.5 L130.0,908.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2)"/><rect x="251.7" y="877.3" width="26.6" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#16a34a"><tspan x="265.0" y="890.5">yes</tspan></text><path d="M510.0,830.0 L575.0,830.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><rect x="532.3" y="820.8" width="20.4" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#dc2626"><tspan x="542.5" y="834.0">no</tspan></text><path d="M790.0,802.0 L790.0,260.0 L660.0,260.0" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a4)"/><rect x="778.0" y="491.4" width="144.1" height="17.1" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="10.5" font-weight="normal" fill="#6b7280"><tspan x="850" y="503.7">add more prompts or stop</tspan></text></svg>