<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1010" width="980" height="1010" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Request activity flow</title><desc id="d">Every step of ROUTE with all exits: validation error, infeasible, budget error, execution error, exhausted or cancelled, and the retry loop.</desc><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="290.0" y="12.0" width="260.0" height="36.0" rx="18.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111827"><tspan x="420" y="34.4">Receive request + policy</tspan></text><rect x="280.0" y="75.0" width="280.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111827"><tspan x="420" y="99.4">Authenticate and validate</tspan></text><rect x="250.0" y="140.0" width="340.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111827"><tspan x="420" y="164.4">Set attempt allowance, deadline, accounting</tspan></text><rect x="250.0" y="213.0" width="340.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="420" y="231.5">Hard filter -&gt; E(q)</tspan><tspan x="420" y="246.9">capability, context, privacy, health, budget</tspan></text><rect x="250.0" y="293.0" width="340.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="420" y="311.5">Classify task; embed; retrieve neighbours;</tspan><tspan x="420" y="326.9">predict Q̂, Ĉ, L̂ per model</tspan></text><rect x="250.0" y="368.0" width="340.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="420" y="394.2">Feasible set F(q): Q̂ ≥ τ, Ĉ ≤ B_rem, L̂ ≤ D_rem</tspan></text><rect x="270.0" y="440.0" width="300.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111827"><tspan x="420" y="464.4">Pick cheapest feasible (tie-break rules)</tspan></text><rect x="250.0" y="508.0" width="340.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="420" y="526.5">Atomically revalidate + reserve</tspan><tspan x="420" y="541.9">conservative spend</tspan></text><rect x="270.0" y="585.0" width="300.0" height="40.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111827"><tspan x="420" y="609.4">Use one attempt; execute via adapter</tspan></text><polygon points="420,658.0 525.0,690 420,722.0 315.0,690" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111827"><tspan x="420" y="694.4">Completed?</tspan></text><rect x="30.0" y="658.0" width="220.0" height="64.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="140" y="686.5">Reconcile usage -&gt; log</tspan><tspan x="140" y="701.9">-&gt; return response</tspan></text><polygon points="420,762.0 570.0,800 420,838.0 270.0,800" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="420" y="796.5">Retryable, safe to repeat,</tspan><tspan x="420" y="811.9">no partial output sent?</tspan></text><polygon points="420,870.0 560.0,905 420,940.0 280.0,905" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="420" y="901.5">Attempts left and caller</tspan><tspan x="420" y="916.9">not cancelled?</tspan></text><rect x="680.0" y="75.0" width="240.0" height="40.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="800" y="99.2">Authentication / validation error</tspan></text><rect x="680.0" y="247.0" width="240.0" height="56.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="800" y="271.5">INFEASIBLE (explicit)</tspan><tspan x="800" y="286.9">no model called, nothing spent</tspan></text><rect x="680.0" y="508.0" width="240.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="800" y="526.5">Budget or state error</tspan><tspan x="800" y="541.9">before dispatch</tspan></text><rect x="680.0" y="770.0" width="240.0" height="60.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="800" y="796.5">Explicit execution error</tspan><tspan x="800" y="811.9">(no splicing of streams)</tspan></text><rect x="680.0" y="883.0" width="240.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="normal" fill="#111827"><tspan x="800" y="909.2">EXHAUSTED or CANCELLED</tspan></text><path d="M420.0,48.0 L420.0,75.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M420.0,115.0 L420.0,140.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M420.0,180.0 L420.0,213.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M420.0,257.0 L420.0,293.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M420.0,337.0 L420.0,368.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M420.0,412.0 L420.0,440.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M420.0,480.0 L420.0,508.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M420.0,552.0 L420.0,585.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M420.0,625.0 L420.0,658.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a0)"/><path d="M560.0,95.0 L680.0,95.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><rect x="600.5" y="85.8" width="39.0" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#dc2626"><tspan x="620.0" y="99.0">fails</tspan></text><path d="M590.0,235.0 L640.0,235.0 L640.0,262.0 L680.0,262.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><text text-anchor="middle" font-size="11" font-weight="normal" fill="#dc2626"><tspan x="640" y="225.8">E empty</tspan></text><path d="M590.0,390.0 L650.0,390.0 L650.0,295.0 L680.0,290.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><text text-anchor="middle" font-size="11" font-weight="normal" fill="#dc2626"><tspan x="630" y="408.9">F empty</tspan></text><path d="M590.0,530.0 L680.0,530.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><rect x="578.2" y="520.8" width="113.6" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#dc2626"><tspan x="635.0" y="534.0">reservation fails</tspan></text><path d="M315.0,690.0 L250.0,690.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2)"/><rect x="269.2" y="680.8" width="26.6" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#16a34a"><tspan x="282.5" y="694.0">yes</tspan></text><path d="M420.0,722.0 L420.0,762.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><rect x="409.8" y="732.8" width="20.4" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#dc2626"><tspan x="420.0" y="746.0">no</tspan></text><path d="M570.0,800.0 L680.0,800.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><rect x="614.8" y="790.8" width="20.4" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#dc2626"><tspan x="625.0" y="804.0">no</tspan></text><path d="M420.0,838.0 L420.0,870.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2)"/><rect x="406.7" y="844.8" width="26.6" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#16a34a"><tspan x="420.0" y="858.0">yes</tspan></text><path d="M560.0,905.0 L680.0,905.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a1)"/><rect x="609.8" y="895.8" width="20.4" height="18.4" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11.5" font-weight="normal" fill="#dc2626"><tspan x="620.0" y="909.0">no</tspan></text><path d="M280.0,905.0 L20.0,905.0 L20.0,235.0 L250.0,235.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a2)"/><rect x="18.8" y="564.2" width="162.4" height="31.5" fill="#ffffff" fill-opacity="0.92"/><text text-anchor="middle" font-size="11" font-weight="normal" fill="#16a34a"><tspan x="100" y="576.8">yes: new attempt, re-check</tspan><tspan x="100" y="590.9">filters, budget, deadline</tspan></text></svg>